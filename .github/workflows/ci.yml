name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Tests et qualité Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHON_DOTENV_DISABLED: "1"

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"

      - name: Installer Python selon .python-version
        run: uv python install

      - name: Installer les dépendances verrouillées
        run: uv sync --frozen --dev

      - name: Vérifier le lint
        run: uv run --frozen ruff check .

      - name: Vérifier le formatage
        run: uv run --frozen ruff format --check .

      - name: Exécuter les tests sans configuration locale
        run: uv run --frozen pytest -q
