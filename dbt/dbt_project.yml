name: riftlab
version: "0.1.0"
config-version: 2
profile: riftlab
require-dbt-version: [">=1.9.0", "<2.0.0"]
flags:
  send_anonymous_usage_stats: false

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  kpi_queue_id: 420
  kpi_map_id: 11

models:
  riftlab:
    +materialized: view
    staging:
      +schema: STAGING
    intermediate:
      +schema: STAGING
    marts:
      +schema: MART
