version: 2

models:
  - name: stg_matches
    description: "Un match par ID ; dernière ingestion retenue, provenance conservée. Durée en secondes."
    columns:
      - name: match_id
        data_tests: [not_null, unique]
      - name: game_start_utc
        data_tests: [not_null]
      - name: duration_seconds
        data_tests: [not_null]
  - name: stg_timelines
    description: "Une timeline par match ; source des mesures par joueur et par frame."
    columns:
      - name: match_id
        data_tests: [not_null, unique]
  - name: int_match_participants
    description: "Une ligne par participant et match, sans filtre de périmètre."
    data_tests:
      - unique_combination:
          columns: [match_id, participant_id]
    columns:
      - name: match_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_matches')
              field: match_id
      - name: participant_id
        data_tests: [not_null]
      - name: puuid
        description: "Identifiant stable du joueur ; ne pas publier dans la documentation de recette."
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
      - name: win
        data_tests: [not_null]
  - name: int_match_teams
    description: "Une ligne par équipe et match ; totaux NULL si les statistiques sont incomplètes."
    data_tests:
      - unique_combination:
          columns: [match_id, team_id]
    columns:
      - name: match_id
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
      - name: win
        data_tests: [not_null]
  - name: fct_player_matches
    description: >
      Fait joueur/partie. Filtrer is_kpi_eligible avant toute agrégation métier.
      Moyennes des ratios par partie ; pourcentages de 0 à 100.
      Les lignes exclues restent consultables via eligibility_reason.
    data_tests:
      - unique_combination:
          columns: [match_id, participant_id]
      - unique_combination:
          columns: [match_id, puuid]
    columns:
      - name: match_id
        data_tests: [not_null]
      - name: participant_id
        data_tests: [not_null]
      - name: puuid
        data_tests: [not_null]
      - name: is_kpi_eligible
        data_tests: [not_null]
      - name: eligibility_reason
        description: "V1 : queue/carte paramétrées, 10 participants, 2 équipes, durée positive, pas de fin anticipée."
        data_tests: [not_null]
      - name: kda
        description: "(Kills + assists) / max(1, deaths) ; NULL si une composante manque."
      - name: kill_participation_pct
        description: "100 × (kills + assists) / kills équipe ; NULL si total nul ou incomplet."
      - name: team_damage_share_pct
        description: "100 × dégâts champions / dégâts champions équipe ; NULL si total nul ou incomplet."
  - name: int_participant_frames
    description: "Une mesure Riot par match, participant et timestamp en millisecondes."
    data_tests:
      - unique_combination:
          columns: [match_id, participant_id, frame_timestamp_ms]
    columns:
      - name: match_id
        data_tests: [not_null]
      - name: participant_id
        data_tests: [not_null]
      - name: frame_timestamp_ms
        data_tests: [not_null]
  - name: fct_player_checkpoints
    description: >-
      Sept repères par ligne de fct_player_matches, y compris les repères sans mesure.
      Filtrer is_kpi_eligible pour le périmètre métier et checkpoint_status pour la couverture.
    data_tests:
      - unique_combination:
          columns: [match_id, participant_id, checkpoint_code]
    columns:
      - name: checkpoint_code
        data_tests:
          - not_null
          - accepted_values:
              values: ['M03', 'M05', 'M10', 'M15', 'M20', 'M30', 'FINAL']
      - name: frame_offset_ms
        description: "Timestamp réel moins timestamp cible ; un écart positif est autorisé jusqu'à 5 secondes."
      - name: checkpoint_status
        description: "Disponibilité de la mesure ; FINAL peut être disponible sans timeline."
        data_tests: [not_null]
      - name: total_gold
        description: "Or cumulé de la frame, ou or gagné issu des statistiques du match pour FINAL."
      - name: total_cs
        description: "Sbires et monstres cumulés, issus des statistiques du match pour FINAL."
      - name: xp
        description: "XP cumulée de la frame ; pour FINAL, NULL si aucune frame à ±5 s de la fin."
      - name: opponent_participant_id
        description: "Adversaire unique du même rôle sur une partie éligible. Les écarts nécessitent aussi une mesure des deux côtés."
